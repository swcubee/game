name: check

# runs only when started by hand (Actions tab -> check -> Run workflow, or: gh workflow run check.yml)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generated data is up to date
        run: |
          node tools/build-pictures.mjs
          git diff --exit-code -- js/pictures.js || (echo "::error::Run the picture generator and commit js/pictures.js" && exit 1)

      - name: Install Playwright
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cell numbers sit on their cells
        run: python tools/check-labels.py

      - name: Play-through on a phone screen
        run: python tools/playtest.py out/phone 390 844 4

      - name: Play-through of all levels on a desktop screen
        run: python tools/playtest.py out/desktop 1280 720 99

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: out/

      - name: Game build for the portal
        run: mkdir -p dist/game && cp -r index.html css js fonts dist/game/

      - uses: actions/upload-artifact@v5
        with:
          name: spooky-paint-game
          path: dist/game/
